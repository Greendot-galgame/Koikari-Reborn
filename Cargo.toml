[package]
name = "koikari-reborn"
version = "0.4.0"
edition = "2021"
rust-version = "1.88"

[lib]
crate-type = ["rlib", "staticlib"]

[[bin]]
name = "koikari"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
lewton = "0.10"
ogg = "0.9"
opus = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
metal = "0.29"
foreign-types = "0.5"

[dev-dependencies]
tempfile = "3.15"

[profile.release]
lto = "thin"
codegen-units = 1
